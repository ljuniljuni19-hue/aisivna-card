<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一张学习卡</title>
  <style>
    body { margin: 0; background: #f2f3e9; color: #163f32; font-family: Arial, 'Microsoft YaHei', sans-serif; }
    .page { max-width: 620px; margin: 48px auto; padding: 0 20px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    .top strong { font-size: 22px; }
    .top span { font-size: 13px; }
    .bar { background: #154735; color: white; padding: 18px 24px; font-weight: bold; }
    .card { background: #fff9f5; padding: 30px 26px; border: 1px solid #dddcd2; }
    h1 { font-size: 30px; margin: 0 0 28px; }
    h2 { font-size: 15px; color: #486b5d; margin: 0 0 10px; }
    p { line-height: 1.8; margin: 0; }
    hr { border: 0; border-top: 1px solid #d9d6cc; margin: 22px 0; }
    @media(max-width: 500px) { .page { margin-top: 24px; } h1 { font-size: 25px; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="top"><strong>AISivna</strong><span>课堂笔记</span></div>
    <div class="bar">我的学习卡</div>
    <article class="card">
      <h1>juni学习日记</h1>
      <section>
        <h2>今天学会了什么？</h2>
        <p>我开始学习 HTML 和 CSS，制作了自己的第一个网页。</p>
      </section>
      <hr>
      <section>
        <h2>下次想做什么？</h2>
        <p>把学习卡部署到网上，让同学也能打开这个链接。</p>
      </section>
    </article>
  </main>
</body>
</html>
